name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release pipeline per tag at a time; never cancel a publishing run
# (a half-published release is worse than a queued one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package.json, backend app-version, and CHANGELOG
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch: skipping tag validation, building from package.json version"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          BACKEND_VERSION=$(sed -n 's/.*(define app-version "\([^"]*\)").*/\1/p' backend/main.rkt)
          echo "tag=$TAG package.json=$ROOT_VERSION backend=$BACKEND_VERSION"
          test -n "$BACKEND_VERSION" || { echo "::error::backend/main.rkt has no app-version"; exit 1; }
          test "$TAG" = "$ROOT_VERSION" || { echo "::error::tag $TAG != package.json $ROOT_VERSION"; exit 1; }
          test "$TAG" = "$BACKEND_VERSION" || { echo "::error::tag $TAG != backend app-version $BACKEND_VERSION"; exit 1; }
          grep -q "^## $TAG" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turinglambdaai/glaze

      # the updater verifies manifests through the crypto package (libcrypto
      # FFI bundled with the Racket distribution)
      - name: Install crypto
        run: raco pkg install --auto --no-docs --skip-installed crypto

      - name: App icon (icns from icon-1024.png)
        run: |
          ICONSET=dist/icon.iconset
          mkdir -p "$ICONSET"
          for spec in 16 32 128 256 512; do
            sips -z $spec $spec icon-1024.png --out "$ICONSET/icon_${spec}x${spec}.png" >/dev/null
            dbl=$((spec * 2))
            sips -z $dbl $dbl icon-1024.png --out "$ICONSET/icon_${spec}x${spec}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o dist/HackDigest.icns
          rm -rf "$ICONSET"

      - name: Package app bundle
        run: |
          raco glaze build \
            --entry backend/main.rkt \
            --name HackDigest \
            --version "$VERSION" \
            --icon dist/HackDigest.icns \
            --sign - \
            --out dist

      - name: Launch smoke (packaged binary serves API and frontend)
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          HACKDIGEST_DATA_DIR="$data_dir" GLAZE_API_TOKEN=smoke-token \
            ./dist/HackDigest.app/Contents/MacOS/HackDigest &
          app_pid=$!
          trap 'kill -9 $app_pid 2>/dev/null || true' exit
          # The app holds several listening sockets (single-instance guard,
          # HTTP server) and their order is not stable: probe every port
          # and let the health endpoint decide which one is the app (same
          # policy as the Linux and Windows smokes).
          port=""
          for _ in $(seq 1 15); do
            sleep 2
            kill -0 "$app_pid" 2>/dev/null || { echo "::error::packaged app exited early"; exit 1; }
            for p in $(lsof -a -p "$app_pid" -iTCP -sTCP:LISTEN -P -n 2>/dev/null | grep -oE ':[0-9]+' | tr -d ':' | sort -u); do
              if curl -fsS -m 10 -H "X-Glaze-Token: smoke-token" "http://127.0.0.1:$p/api/health" 2>/dev/null | grep -q '"ok":true'; then
                port="$p"
                break
              fi
            done
            [ -n "$port" ] && break
          done
          [ -n "$port" ] || { echo "::error::packaged app never listened"; exit 1; }
          curl -fsS -m 5 -H "X-Glaze-Token: smoke-token" "http://127.0.0.1:$port/api/health" | grep -q '"ok":true'
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:$port/")"
          [ "$code" = "200" ] || { echo "::error::frontend returned $code"; exit 1; }

      - name: Portable zip (.app at the archive root)
        run: |
          # Written to the repo root (not dist/) so both artifact paths
          # share the checkout root and upload-artifact stores them flat.
          (cd dist && zip -qry "../hackdigest-$VERSION-macos-${{ matrix.arch }}.zip" HackDigest.app)

      - name: Human installer (DMG, drag to Applications)
        run: |
          set -euo pipefail
          dmg="hackdigest-$VERSION-macos-${{ matrix.arch }}.dmg"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/HackDigest.app "$staging/"
          ln -s /Applications "$staging/Applications"
          # hdiutil create intermittently fails with "Resource busy" on CI
          # runners (Spotlight/mds holding the staging dir) — retry.
          created=""
          for attempt in 1 2 3; do
            if hdiutil create -volname HackDigest -srcfolder "$staging" -ov -format UDZO "$dmg"; then
              created="yes"
              break
            fi
            echo "hdiutil create attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          [ -n "$created" ] || { echo "::error::hdiutil create failed after 3 attempts"; exit 1; }
          hdiutil attach "$dmg" -mountpoint /tmp/hd-dmg-verify -readonly
          test -d /tmp/hd-dmg-verify/HackDigest.app
          hdiutil detach /tmp/hd-dmg-verify

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            hackdigest-*-macos-${{ matrix.arch }}.dmg
            hackdigest-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} (tar.gz + deb)
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            racket-arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            racket-arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Install WebKit/GTK runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev xvfb

      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turinglambdaai/glaze

      # the updater verifies manifests through the crypto package (libcrypto
      # FFI bundled with the Racket distribution)
      - name: Install crypto
        run: raco pkg install --auto --no-docs --skip-installed crypto

      - name: Package distribution directory
        run: |
          raco glaze build \
            --entry backend/main.rkt \
            --name HackDigest \
            --version "$VERSION" \
            --out dist
          test -x dist/bin/HackDigest || { echo "::error::dist/bin/HackDigest executable missing"; exit 1; }
          test -d dist/lib || { echo "::error::dist/lib missing"; exit 1; }

      # Launch smoke, glaze-CI style: the packaged app must come up under
      # xvfb (WEBKIT_DISABLE_DMABUF_RENDERER avoids the GPU-dependent
      # renderer on the runner) and serve API health + frontend. The
      # launcher lands in dist/bin while public/ sits in dist/, so start
      # it with dist/ as the working directory. The packaged launcher
      # execs into the Racket engine (argv[0] becomes racketcs-<ver>), so
      # PID/name-based detection is unreliable: run the app in its own
      # process group via setsid and probe every listening TCP port with
      # the token-protected health endpoint — only our server can answer
      # it, so the health check itself decides which port is the app
      # (same policy as the Windows smoke).
      - name: Launch smoke (packaged binary serves API and frontend)
        run: |
          set -euo pipefail
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          data_dir="$(mktemp -d)"
          export HACKDIGEST_DATA_DIR="$data_dir" GLAZE_API_TOKEN=smoke-token
          cd dist
          setsid xvfb-run -a ./bin/HackDigest &
          run_pid=$!
          trap 'kill -9 -- "-$run_pid" 2>/dev/null || true' exit
          health_port=""
          ports=""
          for _ in $(seq 1 15); do
            sleep 2
            kill -0 "$run_pid" 2>/dev/null || { echo "::error::packaged app exited early"; exit 1; }
            ports="$(lsof -iTCP -sTCP:LISTEN -P -n 2>/dev/null | grep -oE ':[0-9]+' | tr -d ':' | sort -u || true)"
            for p in $ports; do
              if curl -fsS -m 5 -H "X-Glaze-Token: smoke-token" "http://127.0.0.1:$p/api/health" 2>/dev/null | grep -q '"ok":true'; then
                health_port="$p"
                break
              fi
            done
            [ -n "$health_port" ] && break
          done
          [ -n "$health_port" ] || { echo "::error::packaged app never answered api/health (ports: ${ports:-none})"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:$health_port/")"
          [ "$code" = "200" ] || { echo "::error::frontend returned $code"; exit 1; }

      - name: Tar the distribution
        run: |
          stage="$(mktemp -d)/HackDigest"
          mkdir -p "$stage"
          cp -R dist/. "$stage/"
          tar -czf "hackdigest-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C "$(dirname "$stage")" HackDigest

      # Hand-rolled deb (this pipeline does not use glaze build --installer):
      # dpkg-deb is on every ubuntu runner. FHS layout per the task spec —
      # payload at /opt/hackdigest (the launcher's relative bin/ + lib/plt
      # resolution stays intact), a hackdigest wrapper on PATH, a desktop
      # entry and hicolor icons for menu integration. Depends names what
      # the app actually FFI-loads at runtime (glaze webview-linux: gtk-3,
      # webkit2gtk-4.1 with a 4.0 fallback; the updater's crypto package:
      # libcrypto.so.3; external links and the linux update reveal:
      # xdg-open). Everything else (glib/gobject/pixbuf/graphene/...) is
      # pulled in transitively by these.
      - name: Package deb
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64)   deb_arch=amd64 ;;
            arm64) deb_arch=arm64 ;;
            *) echo "::error::no deb arch mapping for ${{ matrix.arch }}"; exit 1 ;;
          esac
          root="$(mktemp -d)/hackdigest-deb"
          mkdir -p "$root/DEBIAN" \
                   "$root/opt/hackdigest" \
                   "$root/usr/bin" \
                   "$root/usr/share/applications"
          cp -R dist/. "$root/opt/hackdigest/"
          cat > "$root/usr/bin/hackdigest" <<'EOF'
          #!/bin/sh
          exec /opt/hackdigest/bin/HackDigest "$@"
          EOF
          chmod 755 "$root/usr/bin/hackdigest"
          for s in 16 24 32 48 64 128 256 512; do
            dir="$root/usr/share/icons/hicolor/${s}x${s}/apps"
            mkdir -p "$dir"
            convert icon-1024.png -resize ${s}x${s} "$dir/hackdigest.png"
          done
          cat > "$root/usr/share/applications/hackdigest.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HackDigest
          GenericName=Hacker News reader
          Comment=Hacker News with built-in translation and AI digests
          Exec=/usr/bin/hackdigest
          Icon=hackdigest
          Terminal=false
          Categories=Network;Utility;
          EOF
          installed_size="$(du -sk --apparent-size "$root/opt/hackdigest" | cut -f1)"
          cat > "$root/DEBIAN/control" <<EOF
          Package: hackdigest
          Version: $VERSION
          Architecture: $deb_arch
          Maintainer: Turing Lambda <jirentianxiang1024@gmail.com>
          Section: net
          Priority: optional
          Installed-Size: $installed_size
          Depends: libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37, libgtk-3-0, libssl3, xdg-utils
          Homepage: https://github.com/turinglambdaai/hackdigest
          Description: Hacker News reader with built-in translation and AI digests
           HackDigest turns Hacker News into your language: on-demand translation
           of stories and comment threads, three-layer AI digests (article TL;DR,
           thread digest, daily digest), and a keyboard-first UI served by a
           Racket (Glaze) backend in a native WebKitGTK window.
           .
           Bring your own OpenAI-compatible API key (GLM, DeepSeek, Qwen, Kimi,
           OpenAI, or a local Ollama). Data stays local in SQLite.
          EOF
          cat > "$root/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q || true
          fi
          EOF
          chmod 755 "$root/DEBIAN/postinst"
          dpkg-deb --root-owner-group --build "$root" "hackdigest-$VERSION-linux-${{ matrix.arch }}.deb"
          dpkg-deb -I "hackdigest-$VERSION-linux-${{ matrix.arch }}.deb"

      # Depends sufficiency proof: install the deb into a clean Ubuntu
      # 22.04 container where the ONLY extra packages are the test harness
      # itself (xvfb to host the window). If a runtime FFI library were
      # missing from Depends, apt would fail to resolve — and if the app
      # still could not start with what Depends pulled in, the launch
      # check below dies. The deep API/frontend probe already ran on the
      # runner; this asserts the deb installs and boots with declared deps
      # alone (Debian arch names differ from the asset naming: amd64/arm64).
      - name: deb Depends test (clean ubuntu:22.04 container)
        run: |
          set -euo pipefail
          deb="hackdigest-$VERSION-linux-${{ matrix.arch }}.deb"
          docker run --rm -v "$PWD:/work" -w /work -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:22.04 bash -euc '
            apt-get update -qq
            apt-get install -y --no-install-recommends "./'"$deb"'" xvfb
            test -x /opt/hackdigest/bin/HackDigest
            test -x /usr/bin/hackdigest
            test -f /usr/share/applications/hackdigest.desktop
            test -f /usr/share/icons/hicolor/256x256/apps/hackdigest.png
            mkdir -p /tmp/hd-data
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            export HACKDIGEST_DATA_DIR=/tmp/hd-data GLAZE_API_TOKEN=deb-smoke
            timeout 30 xvfb-run -a /usr/bin/hackdigest >/tmp/hd-deb-smoke.log 2>&1 &
            app_pid=$!
            sleep 15
            if kill -0 "$app_pid" 2>/dev/null; then
              echo "deb install: app process alive after 15s with declared deps only"
            else
              echo "::error::app died under declared Depends only; smoke log:"
              cat /tmp/hd-deb-smoke.log
              exit 1
            fi
          '

      # Optional-family format, x64 only. appimagetool from its official
      # continuous release, verified against the sha256 digest GitHub
      # computes for the asset. APPIMAGE_EXTRACT_AND_RUN keeps everything
      # working on FUSE-less runners (tool build, self-check, smoke).
      # Like the tar.gz and deb, the AppImage relies on the system
      # WebKitGTK — it bundles the app, not the desktop stack.
      - name: Package AppImage (x64)
        if: matrix.arch == 'x64'
        run: |
          set -euo pipefail
          asset="appimagetool-x86_64.AppImage"
          api_url="https://api.github.com/repos/AppImage/appimagetool/releases/tags/continuous"
          expected="$(curl -fsSL "$api_url" | jq -r ".assets[] | select(.name == \"$asset\") | .digest" | sed 's/^sha256://')"
          curl -fsSL -o "$asset" "https://github.com/AppImage/appimagetool/releases/download/continuous/$asset"
          actual="$(sha256sum "$asset" | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::appimagetool checksum mismatch (expected ${expected:-none}, got $actual)"
            exit 1
          fi
          chmod +x "$asset"
          export APPIMAGE_EXTRACT_AND_RUN=1
          "$asset" --version | grep -q appimagetool || { echo "::error::appimagetool does not run"; exit 1; }

          appdir="$(mktemp -d)/HackDigest.AppDir"
          mkdir -p "$appdir/usr/bin" \
                   "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps" \
                   "$appdir/opt/hackdigest"
          cp -R dist/. "$appdir/opt/hackdigest/"
          cat > "$appdir/usr/bin/hackdigest" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/../../opt/hackdigest/bin/HackDigest" "$@"
          EOF
          chmod 755 "$appdir/usr/bin/hackdigest"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/hackdigest" "$@"
          EOF
          chmod 755 "$appdir/AppRun"
          cat > "$appdir/hackdigest.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HackDigest
          GenericName=Hacker News reader
          Comment=Hacker News with built-in translation and AI digests
          Exec=hackdigest
          Icon=hackdigest
          Terminal=false
          Categories=Network;Utility;
          EOF
          cp "$appdir/hackdigest.desktop" "$appdir/usr/share/applications/hackdigest.desktop"
          convert icon-1024.png -resize 256x256 "$appdir/hackdigest.png"
          cp "$appdir/hackdigest.png" "$appdir/usr/share/icons/hicolor/256x256/apps/hackdigest.png"
          ln -s hackdigest.png "$appdir/.DirIcon"
          "$asset" --no-appstream "$appdir" "hackdigest-$VERSION-linux-x64.AppImage"

      - name: AppImage smoke (x64)
        if: matrix.arch == 'x64'
        run: |
          set -euo pipefail
          export WEBKIT_DISABLE_DMABUF_RENDERER=1 APPIMAGE_EXTRACT_AND_RUN=1
          data_dir="$(mktemp -d)"
          export HACKDIGEST_DATA_DIR="$data_dir" GLAZE_API_TOKEN=smoke-token
          app="hackdigest-$VERSION-linux-x64.AppImage"
          setsid xvfb-run -a "./$app" &
          run_pid=$!
          trap 'kill -9 -- "-$run_pid" 2>/dev/null || true' exit
          health_port=""
          for _ in $(seq 1 15); do
            sleep 2
            kill -0 "$run_pid" 2>/dev/null || { echo "::error::AppImage exited early"; exit 1; }
            for p in $(lsof -iTCP -sTCP:LISTEN -P -n 2>/dev/null | grep -oE ':[0-9]+' | tr -d ':' | sort -u || true); do
              if curl -fsS -m 5 -H "X-Glaze-Token: smoke-token" "http://127.0.0.1:$p/api/health" 2>/dev/null | grep -q '"ok":true'; then
                health_port="$p"
                break
              fi
            done
            [ -n "$health_port" ] && break
          done
          [ -n "$health_port" ] || { echo "::error::AppImage never answered api/health"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:$health_port/")"
          [ "$code" = "200" ] || { echo "::error::frontend returned $code"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            hackdigest-*-linux-${{ matrix.arch }}.tar.gz
            hackdigest-*-linux-${{ matrix.arch }}.deb
            hackdigest-*-linux-x64.AppImage
          if-no-files-found: error

  windows:
    name: Windows x64 MSI
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turinglambdaai/glaze

      # the updater verifies manifests through the crypto package (libcrypto
      # FFI bundled with the Racket distribution)
      - name: Install crypto
        run: raco pkg install --auto --no-docs --skip-installed crypto

      - name: Install WiX 5.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Package app and MSI installer
        shell: bash
        run: |
          raco glaze build \
            --entry backend/main.rkt \
            --name HackDigest \
            --version "$VERSION" \
            --publisher 'Turing Lambda' \
            --identifier 'TuringLambda.HackDigest' \
            --out dist \
            --installer
          test -f dist/HackDigest.msi || { echo "::error::dist/HackDigest.msi missing"; exit 1; }
          test -f dist/HackDigest.exe || { echo "::error::dist/HackDigest.exe missing"; exit 1; }

      - name: Validate MSI metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path 'dist/HackDigest.msi').Path
          wix msi validate $msi
          $wxs = Join-Path $env:RUNNER_TEMP 'hackdigest-release.wxs'
          wix msi decompile $msi -o $wxs
          [xml] $xml = Get-Content -Raw $wxs
          $package = $xml.Wix.Package
          if ($package.Name -ne 'HackDigest') { throw "unexpected MSI name: $($package.Name)" }
          if ($package.Manufacturer -ne 'Turing Lambda') { throw "unexpected MSI publisher: $($package.Manufacturer)" }
          if ($package.Version -ne $env:VERSION) { throw "unexpected MSI version: $($package.Version)" }
          if (-not $package.ProductCode -or -not $package.UpgradeCode) { throw 'MSI is missing ProductCode or UpgradeCode' }

      - name: Flat-stage native DLLs beside the executable
        shell: pwsh
        run: |
          # raco distribute leaves loader DLLs (e.g. WebView2Loader.dll)
          # inside dist/lib; a Windows exe only probes its own directory,
          # so copy every collected DLL next to dist/HackDigest.exe.
          Get-ChildItem -Path dist -Recurse -Filter *.dll |
            Where-Object { $_.DirectoryName -ne (Resolve-Path 'dist').Path } |
            Copy-Item -Destination (Resolve-Path 'dist').Path -Force
          Get-ChildItem dist -Filter *.dll | Select-Object -ExpandProperty Name

      - name: Ensure WebView2 Runtime (Evergreen)
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { Write-Host "WebView2 Runtime present: $((Get-ItemProperty $key).pv)"; exit 0 }
          Write-Host "WebView2 Runtime missing; installing via Evergreen Bootstrapper"
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2099617' -OutFile "$env:RUNNER_TEMP\webview2-bootstrapper.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\webview2-bootstrapper.exe" -Wait -PassThru -ArgumentList '/silent','/install'
          if ($p.ExitCode -ne 0) { throw "WebView2 bootstrapper exited $($p.ExitCode)" }

      - name: Launch smoke (packaged binary serves API and frontend)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dataDir = Join-Path $env:RUNNER_TEMP 'hd-smoke-data'
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $env:HACKDIGEST_DATA_DIR = $dataDir
          $env:GLAZE_API_TOKEN = 'smoke-token'
          $outLog = Join-Path $env:RUNNER_TEMP 'hd-smoke-out.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'hd-smoke-err.log'
          $proc = Start-Process -FilePath (Resolve-Path 'dist/HackDigest.exe').Path -PassThru `
            -WorkingDirectory (Resolve-Path 'dist').Path `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          try {
            # The app process can hold several listening sockets (single-
            # instance guard, internal services), and which one comes first
            # is not stable — probe every port and let the health endpoint
            # decide which one is the HTTP server.
            $health = $null
            $port = $null
            foreach ($try in 1..3) {
              Start-Sleep -Seconds 2
              if ($proc.HasExited) { throw "packaged app exited early (exit code $($proc.ExitCode))" }
              $ports = Get-NetTCPConnection -OwningProcess $proc.Id -State Listen -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty LocalPort -Unique
              Write-Host "listen candidates: $($ports -join ', ')"
              foreach ($p in $ports) {
                try {
                  $health = Invoke-WebRequest -UseBasicParsing -NoProxy -Headers @{ 'X-Glaze-Token' = 'smoke-token' } -Uri "http://127.0.0.1:$p/api/health" -TimeoutSec 20
                  $port = $p
                  break
                } catch { Write-Host "port ${p}: $($_.Exception.Message)" }
              }
              if ($health) { break }
              if ($try -eq 3) { throw "health check failed after 3 tries across ports: $($ports -join ', ')" }
              Start-Sleep -Seconds 5
            }
            if ($health.Content -notmatch '"ok":true') { throw "health check failed: $($health.Content)" }
            $front = Invoke-WebRequest -UseBasicParsing -NoProxy -Uri "http://127.0.0.1:$port/" -TimeoutSec 20
            if ($front.StatusCode -ne 200) { throw "frontend returned $($front.StatusCode)" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if ($proc.HasExited -and $proc.ExitCode -ne 0) {
              Write-Host "::group::smoke stdout"
              if (Test-Path $outLog) { Get-Content $outLog }
              Write-Host "::endgroup::"
              Write-Host "::group::smoke stderr"
              if (Test-Path $errLog) { Get-Content $errLog }
              Write-Host "::endgroup::"
            }
          }

      - name: Name the installer artifact
        shell: bash
        run: mv dist/HackDigest.msi "hackdigest-$VERSION-windows-x64.msi"

      # Portable zip: everything the MSI installs, runnable from anywhere.
      # The MSI is moved out first, so what remains in dist/ is exactly the
      # portable payload (exe + flat loader DLLs + lib/ + public/).
      - name: Portable zip (self-contained folder at the archive root)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "hackdigest-$env:VERSION-windows-x64"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Get-ChildItem dist | Copy-Item -Destination $stage -Recurse -Force
          Compress-Archive -Path $stage -DestinationPath "hackdigest-$env:VERSION-windows-x64.zip" -Force
          Remove-Item -Recurse -Force $stage

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            hackdigest-*-windows-x64.msi
            hackdigest-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish
    needs: [macos, linux, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Signing the update feed needs the same racket the app ships with
      # (glaze/update schema structs + the crypto package's libcrypto FFI).
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          version: stable
          distribution: full

      - name: Install glaze and crypto
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turinglambdaai/glaze crypto

      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact dirs
        run: |
          # Depth-agnostic: upload-artifact can nest files (its LCA rule
          # preserves path prefixes), so pull every file up to dist/ and
          # drop whatever directories remain.
          find dist -mindepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          ls -la dist/
      - name: Sign the update feed (update-manifest.json)
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            v*)
              if [[ -n "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
                KEY_PEM="$RUNNER_TEMP/update-signing-key.pem"
                printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
                scripts/make-update-manifest.sh "$GITHUB_REF_NAME" dist "$KEY_PEM"
              else
                echo "::warning::UPDATE_ED25519_PRIVATE_KEY not set — release ships without an update manifest (clients fall back to release-page updates)"
              fi
              ;;
            *) echo "non-tag ref $GITHUB_REF_NAME: skipping update feed signing" ;;
          esac
      - name: Ensure SHA256SUMS
        run: |
          cd dist
          [ -f SHA256SUMS ] || {
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          }
          shasum -a 256 --check SHA256SUMS
      - name: Publish release (notes = CHANGELOG section for this version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v header="## ${VERSION}" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || { echo "::error::empty release notes — CHANGELOG.md has no '## ${VERSION}' section"; exit 1; }
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/hackdigest >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/hackdigest
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/hackdigest \
              --title "HackDigest ${{ github.ref_name }}" \
              --notes-file /tmp/notes.md
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
