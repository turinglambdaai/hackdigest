name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests (core)
        run: pnpm test

      - name: Type-check
        run: pnpm check

      - name: Build frontend
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: stable

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turinglambdaai/glaze

      # the updater verifies manifests through the crypto package (libcrypto
      # FFI bundled with the Racket distribution)
      - name: Install crypto
        run: raco pkg install --auto --no-docs --skip-installed crypto

      - name: Backend tests
        run: raco test backend/
