name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests (core)
        run: pnpm test

      - name: Type-check
        run: pnpm check

      - name: Build frontend
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: stable

      # Pinned to the glaze main head carrying the G4 native-host
      # conformance matrix (green on all three OSes); flip to the next
      # tagged release (v0.18.0) once it exists.
      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turinglambdaai/glaze.git#aab28f2fdf4446df524a26a46cbf8ba1ae38447d

      # the updater verifies manifests through the crypto package (libcrypto
      # FFI bundled with the Racket distribution)
      - name: Install crypto
        run: raco pkg install --auto --no-docs --skip-installed crypto

      - name: Backend tests
        run: raco test backend/

      - name: Application schema compatibility
        run: raco glaze schema check --json
