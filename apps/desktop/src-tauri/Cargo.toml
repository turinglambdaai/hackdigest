[package]
name = "hackdigest"
version = "0.2.0"
description = "Hacker News, in your language"
authors = ["jrtxio"]
edition = "2021"

[lib]
name = "hackdigest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = "1"
serde_json = "1"
tauri-plugin-http = "~2.6.0"
tauri-plugin-opener = "2"
tauri-plugin-updater = "~2.12.0"
tauri-plugin-process = "~2.3.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
